name: Documentation MkDocs

on:
  push:
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - 'bin/generate_docs_html.py'
      - 'bin/build_documentation.py'
      - 'bin/build_docs.sh'
      - 'mkdocs.yml'
      - 'lib/**/*.py'
      - 'requirements-docs.txt'
      - 'tests/test_doc*.py'
      - 'tests/fixtures/documentation_crossings.js'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - 'bin/generate_docs_html.py'
      - 'bin/build_documentation.py'
      - 'bin/build_docs.sh'
      - 'mkdocs.yml'
      - 'lib/**/*.py'
      - 'requirements-docs.txt'
      - 'tests/test_doc*.py'
      - 'tests/fixtures/documentation_crossings.js'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/docs-browsers
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Installer les dépendances documentaires
        run: python3 -m pip install -r requirements-docs.txt
      - name: Installer Chromium et ses bibliothèques système
        run: python3 -m playwright install --with-deps chromium
      - name: Générer MkDocs, HTML autonome et PDF
        run: python3 bin/build_documentation.py
      - name: Vérifier les générateurs et le placement automatique
        run: python3 -m unittest discover -s tests -p 'test_doc*.py'
      - name: Conserver les trois formats téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Préparer le site GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier la documentation
        id: deployment
        uses: actions/deploy-pages@v4
